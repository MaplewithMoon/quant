# =============================================================================
#  CI —— 每次 push / PR 自动在干净环境里装依赖并跑测试
#
#  为什么需要它：
#    本地能跑 ≠ 别人能跑。CI 每次从零建环境，能抓住"忘了写进 pyproject 的依赖"、
#    "只在 Windows 上能跑的路径假设"、"改动悄悄改变了回测结果"这类问题。
#
#  运行位置：GitHub 仓库的 Actions 页面（推送到 GitHub 后自动生效）
#  手动触发：Actions -> CI -> Run workflow（workflow_dispatch）
# =============================================================================

name: CI

on:
  push:                 # 任何分支 push 都跑
  pull_request:         # 任何 PR 都跑
  workflow_dispatch:    # 支持在网页上手动点一下

# 同一分支连续 push 时，取消上一次还没跑完的任务，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  主任务：装依赖 + 跑测试（这是门禁，失败即 CI 失败）
  # ---------------------------------------------------------------------------
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # 强制 Python 全链路使用 UTF-8。
    # 代码与测试输出里有中文，Windows runner 默认 cp1252 编码会直接
    # UnicodeEncodeError 让测试失败，必须显式指定。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false      # 一个平台失败不影响另一个平台继续跑完
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                        # 按 pyproject.toml 缓存依赖，加速后续运行
          cache-dependency-path: pyproject.toml

      # 只装 pyproject 里声明的依赖 —— 这就是在验证 pyproject 是不是写全了
      # [dev] 额外带入 pytest / ruff
      - name: 安装依赖（pip install -e ".[dev]"）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 依赖一致性检查
        run: python -m pip check

      # 比单元测试更早暴露问题：包能不能 import 得通
      - name: 导入冒烟测试
        run: |
          python -c "import database.loader, database.storage, data.dataset, data.preprocessor, backtest.engine, backtest.metrics, backtest.lookahead, strategy.classic, strategy.modern, execution.broker, portfolio.portfolio, risk.manager, analytics.visualizer; print('全部框架模块导入成功')"

      # 注意：测试用 mocks 造数据，不读 db/、不联网，所以能在 CI 里跑。
      # 测试配置（testpaths / pythonpath）来自 pyproject.toml 的 [tool.pytest.ini_options]
      - name: 单元测试
        run: python -m pytest -v

      # 项目自带的运行器也跑一遍，确保两种入口都可用
      - name: 单元测试（项目自带 run_tests.py）
        run: python scripts/run_tests.py

  # ---------------------------------------------------------------------------
  #  静态检查：只报告，不阻断（continue-on-error）
  #  现有代码还有不少未使用导入等问题，等清理干净后再把 continue-on-error 去掉，
  #  它就会变成真正的门禁。
  # ---------------------------------------------------------------------------
  lint:
    name: lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 安装 ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check .
